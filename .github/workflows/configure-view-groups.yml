name: Configure project view groupings
on:
  push:
    paths:
      - scripts/configure_view_groups.py
      - .github/workflows/configure-view-groups.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match board groupings
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 scripts/configure_view_groups.py
