name: Offline training checks

on:
  push:
  pull_request:

jobs:
  synthetic-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/xg/requirements.lock
      - run: python -m pip install -r scripts/xg/requirements.lock
      - name: Check offline training with invented data only
        run: python -m unittest discover -s scripts/xg/training_tests -p 'test_*.py' -v
