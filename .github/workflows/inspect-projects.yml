name: Inspect project boards
on:
  push:
    paths:
      - .github/workflows/inspect-projects.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read project structure
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api graphql -f query='
            query {
              user(login:"leovferreira13") {
                source: projectV2(number:2) {
                  title
                  fields(first:50) { nodes {
                    ... on ProjectV2Field { name dataType }
                    ... on ProjectV2SingleSelectField { name dataType options { name color description } }
                    ... on ProjectV2IterationField { name dataType }
                  } }
                  views(first:20) { nodes { name layout } }
                }
                target: projectV2(number:3) {
                  title
                  fields(first:50) { nodes {
                    ... on ProjectV2Field { name dataType }
                    ... on ProjectV2SingleSelectField { name dataType options { name color description } }
                    ... on ProjectV2IterationField { name dataType }
                  } }
                  views(first:20) { nodes { name layout } }
                  items(first:30) { nodes {
                    content { ... on Issue { number repository { nameWithOwner } } }
                    fieldValueByName(name:"Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  } }
                }
              }
            }' --jq '.data.user'
