name: Task
description: A bounded piece of product or engineering work
title: "[Task]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What can someone observe when this is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this matter now? Link the roadmap milestone.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Include relevant constraints and excluded adjacent work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable checkboxes.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Tests, browsers, devices, or sample scenarios.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Other Issues, docs, data, or open decisions.
